name: 'pii-scan'
description: 'Find PII and secrets in changed files with regex validators and optional AWS Comprehend / Bedrock Guardrails layers'
author: 'Ventz Petkov'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  paths:
    description: 'Path to scan, relative to the workspace'
    required: false
    default: '.'
  scan-all:
    description: 'Scan every file under the path instead of only changed files'
    required: false
    default: 'false'
  base:
    description: 'Git ref or SHA to diff against. Defaults to the pull request base, or the previous commit on push'
    required: false
    default: ''
  layers:
    description: 'Comma-separated detection layers: regex, contains, guardrails, detect'
    required: false
    default: 'regex'
  fail-on:
    description: 'Fail on findings at or above: critical, high, medium, low, any, never'
    required: false
    default: 'high'
  min-confidence:
    description: 'Minimum score (0.0-1.0) for AWS detections'
    required: false
    default: ''
  output-format:
    description: 'Report format: sarif, jsonl, json, csv, or text'
    required: false
    default: 'sarif'
  report-path:
    description: 'Where to write the report (default: $RUNNER_TEMP/pii-scan-report.<format>, outside the workspace)'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF report to GitHub code scanning (needs security-events: write)'
    required: false
    default: 'false'
  custom-regex-file:
    description: 'Path to a custom regex rules file'
    required: false
    default: ''
  config-file:
    description: 'Path to a configuration file'
    required: false
    default: ''
  exclude-dirs:
    description: 'Comma-separated directory names to skip'
    required: false
    default: ''
  exclude-exts:
    description: 'Comma-separated file suffixes to skip'
    required: false
    default: ''
  workers:
    description: 'File worker threads'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for AWS layers'
    required: false
    default: ''
  guardrail-id:
    description: 'Bedrock guardrail ID or ARN (guardrails layer)'
    required: false
    default: ''
  allow-incomplete:
    description: 'Do not fail when some files could not be scanned'
    required: false
    default: 'false'
  verbose:
    description: 'Verbose output'
    required: false
    default: 'false'
  quiet:
    description: 'Only findings and errors'
    required: false
    default: 'false'

outputs:
  exit-code:
    description: '0 passed, 1 findings, 2 configuration error, 3 incomplete'
    value: ${{ steps.scan.outputs.exit-code }}
  report-path:
    description: 'Path of the report file'
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # explicit version: never read a uv version requirement from the repository being scanned
        version: '0.12.13'

    - name: Run pii-scan
      id: scan
      shell: bash
      env:
        IN_PATHS: ${{ inputs.paths }}
        IN_SCAN_ALL: ${{ inputs.scan-all }}
        IN_BASE: ${{ inputs.base }}
        IN_LAYERS: ${{ inputs.layers }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        IN_OUTPUT_FORMAT: ${{ inputs.output-format }}
        IN_REPORT_PATH: ${{ inputs.report-path }}
        IN_CUSTOM_REGEX: ${{ inputs.custom-regex-file }}
        IN_CONFIG: ${{ inputs.config-file }}
        IN_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        IN_EXCLUDE_EXTS: ${{ inputs.exclude-exts }}
        IN_WORKERS: ${{ inputs.workers }}
        IN_REGION: ${{ inputs.aws-region }}
        IN_GUARDRAIL_ID: ${{ inputs.guardrail-id }}
        IN_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        IN_VERBOSE: ${{ inputs.verbose }}
        IN_QUIET: ${{ inputs.quiet }}
        EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        EVENT_BEFORE: ${{ github.event.before }}
      run: |
        set -uo pipefail

        fail() { echo "::error title=pii-scan::$1"; exit 2; }
        is_bool() { [[ "$1" == "true" || "$1" == "false" ]] || fail "$2 must be true or false"; }

        is_bool "$IN_SCAN_ALL" scan-all
        is_bool "$IN_ALLOW_INCOMPLETE" allow-incomplete
        is_bool "$IN_VERBOSE" verbose
        is_bool "$IN_QUIET" quiet
        [[ "$IN_OUTPUT_FORMAT" =~ ^(sarif|jsonl|json|csv|text)$ ]] || fail "output-format is invalid"
        [[ -z "$IN_MIN_CONFIDENCE" || "$IN_MIN_CONFIDENCE" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]] || fail "min-confidence must be 0.0-1.0"
        [[ -z "$IN_WORKERS" || "$IN_WORKERS" =~ ^[0-9]+$ ]] || fail "workers must be a number"

        report="$IN_REPORT_PATH"
        [[ -z "$report" ]] && report="$RUNNER_TEMP/pii-scan-report.$IN_OUTPUT_FORMAT"

        # config-file and custom-regex-file come from the checked-out tree, which a pull request can
        # edit: --restricted-config lets them only add rules or raise severities. The workspace
        # .git/config is written by actions/checkout, not by the pull request, so it is trusted.
        args=(scan "$IN_PATHS" --layers "$IN_LAYERS" --fail-on "$IN_FAIL_ON"
              --output "$IN_OUTPUT_FORMAT" --report "$report" --github --progress lines
              --restricted-config --trust-repo)

        if [[ "$IN_SCAN_ALL" == "true" ]]; then
          args+=(--all)
        else
          base="$IN_BASE"
          [[ -z "$base" ]] && base="$EVENT_PR_BASE"
          [[ -z "$base" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] && base="$EVENT_BEFORE"
          [[ -n "$base" ]] && args+=(--base "$base")
        fi

        [[ -n "$IN_MIN_CONFIDENCE" ]] && args+=(--min-confidence "$IN_MIN_CONFIDENCE")
        [[ -n "$IN_CUSTOM_REGEX" ]] && args+=(--custom-regex "$IN_CUSTOM_REGEX")
        [[ -n "$IN_CONFIG" ]] && args+=(--config "$IN_CONFIG")
        [[ -n "$IN_EXCLUDE_DIRS" ]] && args+=(--exclude-dirs "$IN_EXCLUDE_DIRS")
        [[ -n "$IN_EXCLUDE_EXTS" ]] && args+=(--exclude-exts "$IN_EXCLUDE_EXTS")
        [[ -n "$IN_WORKERS" ]] && args+=(--workers "$IN_WORKERS")
        [[ -n "$IN_REGION" ]] && args+=(--region "$IN_REGION")
        [[ -n "$IN_GUARDRAIL_ID" ]] && args+=(--guardrail-id "$IN_GUARDRAIL_ID")
        [[ "$IN_ALLOW_INCOMPLETE" == "true" ]] && args+=(--allow-incomplete)
        [[ "$IN_VERBOSE" == "true" ]] && args+=(--verbose)
        [[ "$IN_QUIET" == "true" ]] && args+=(--quiet)

        uv run --quiet --locked --no-dev --project "$GITHUB_ACTION_PATH" pii-scan "${args[@]}"
        code=$?
        {
          echo "exit-code=$code"
          echo "report-path=$report"
        } >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF
      # only complete scans: a partial SARIF could make code scanning close alerts that still exist
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.output-format == 'sarif' && (steps.scan.outputs.exit-code == '0' || steps.scan.outputs.exit-code == '1') }}
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ steps.scan.outputs.report-path }}
        category: pii-scan

    - name: Enforce result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "pii-scan passed." ;;
          1) echo "::error title=pii-scan::Findings at or above the fail-on threshold. See annotations and the job summary." ;;
          3) echo "::error title=pii-scan::Some files could not be scanned. See the job summary." ;;
          *) echo "::error title=pii-scan::pii-scan did not complete (exit code ${CODE:-unknown})." ;;
        esac
        exit "${CODE:-2}"
