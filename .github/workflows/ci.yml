name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded pull request runs are cancelled; every run on main finishes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        re2: [true]
        include:
          # free-threaded builds: google-re2 publishes no wheels for them, so its tests skip
          - { os: ubuntu-latest, python: '3.14t', re2: false }
          - { os: macos-latest, python: '3.14t', re2: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
      - name: Install
        env:
          PYTHON: ${{ matrix.python }}
          RE2: ${{ matrix.re2 }}
        run: |
          args=(--locked --python "$PYTHON")
          [[ "$RE2" == "true" ]] && args+=(--extra re2)
          uv sync "${args[@]}"
      - name: Test
        run: uv run --no-sync pytest -q

  windows:
    # Windows protections (no-follow opens, ACLs, junctions) use Win32 calls that only run here.
    name: test (windows-latest, ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest-but-one: ntpath.isabs changed for rooted paths ("\\data") in 3.13
        python: ['3.11', '3.13']
    env:
      # Hang diagnosis: earlier runs stalled with no log, and neither timeout ended the step.
      # pytest-timeout dumps every thread's stack and exits from inside the process;
      # pytest-bounded.sh ends the step at its deadline even if pytest can't be killed, and the
      # logs are kept as an artifact. The likeliest suspects run first, in their own step.
      SUSPECTS: junction or null_device or private
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
      - name: Install
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: uv sync --locked --python "$PYTHON" --extra re2
      - name: Test likely hangs
        timeout-minutes: 9
        shell: bash
        run: bash .github/scripts/pytest-bounded.sh pytest-windows-suspects.log 420 -v --timeout=60 --timeout-method=thread tests/test_platform.py -k "$SUSPECTS"
      - name: Test the rest
        if: ${{ success() || failure() }}
        timeout-minutes: 9
        shell: bash
        run: |
          mapfile -t ids < <(/usr/bin/timeout -k 10 120 .venv/Scripts/python.exe -m pytest --collect-only -q \
            tests/test_platform.py -k "$SUSPECTS" </dev/null | tr -d '\r' | grep -E '^tests/[^ ]+::')
          (( ${#ids[@]} )) || { echo "::error::no suspect test IDs collected"; exit 1; }
          deselect=()
          for id in "${ids[@]}"; do deselect+=(--deselect "$id"); done
          bash .github/scripts/pytest-bounded.sh pytest-windows-rest.log 360 -v --timeout=60 \
            --timeout-method=thread "${deselect[@]}"
      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-windows-${{ matrix.python }}
          path: pytest-windows*.log
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  action:
    # Runs this repository's action.yml the way a consumer would.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare inputs
        run: |
          mkdir -p ci-clean
          echo "nothing sensitive here" > ci-clean/notes.txt
          echo '{"rules": [{"id": "emp", "pattern": "EMP-[0-9]{6}"}]}' > ci-rules-re2.json
          echo '{"rules": [{"id": "emp", "pattern": "EMP-(?=[0-9])[0-9]{6}"}]}' > ci-rules-lookahead.json
          # more matches than max_matches_per_rule (10,000): the file is not scanned
          mkdir -p ci-match-limit
          for _ in $(seq 10001); do echo "EMP-123456"; done > ci-match-limit/many.txt
      - name: Clean tree passes
        id: clean
        uses: ./
        with:
          paths: ci-clean
          scan-all: 'true'
          output-format: jsonl
      - name: Sample data fails with findings
        id: sample
        continue-on-error: true
        uses: ./
        with:
          paths: sample_testing_data.txt
          scan-all: 'true'
      - name: RE2 custom rule is accepted
        id: re2
        uses: ./
        with:
          paths: ci-clean
          scan-all: 'true'
          custom-regex-file: ci-rules-re2.json
      - name: Lookahead custom rule is refused
        id: lookahead
        continue-on-error: true
        uses: ./
        with:
          paths: ci-clean
          scan-all: 'true'
          custom-regex-file: ci-rules-lookahead.json
      - name: Incomplete scan reports complete=false
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          paths: ci-match-limit
          scan-all: 'true'
          custom-regex-file: ci-rules-re2.json
      - name: Check exit codes
        env:
          CLEAN: ${{ steps.clean.outputs.exit-code }}
          CLEAN_COMPLETE: ${{ steps.clean.outputs.complete }}
          SAMPLE_COMPLETE: ${{ steps.sample.outputs.complete }}
          INCOMPLETE: ${{ steps.incomplete.outputs.exit-code }}
          INCOMPLETE_COMPLETE: ${{ steps.incomplete.outputs.complete }}
          SAMPLE: ${{ steps.sample.outputs.exit-code }}
          RE2: ${{ steps.re2.outputs.exit-code }}
          LOOKAHEAD: ${{ steps.lookahead.outputs.exit-code }}
        run: |
          check() { [[ "$2" == "$3" ]] || { echo "::error::$1 exited ${2:-unknown}, expected $3"; exit 1; }; }
          check "clean scan" "$CLEAN" 0
          check "clean scan complete" "$CLEAN_COMPLETE" true
          check "sample scan complete" "$SAMPLE_COMPLETE" true
          check "incomplete scan" "$INCOMPLETE" 3
          check "incomplete scan complete" "$INCOMPLETE_COMPLETE" false
          check "sample scan" "$SAMPLE" 1
          check "RE2 custom rule" "$RE2" 0
          check "lookahead custom rule" "$LOOKAHEAD" 2
